plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${rootProject.forge_parchment_mappings_version}-${rootProject.forge_parchment_minecraft_version}"
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${rootProject.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.java {
    srcDir rootProject.file('common-core/src/main/java')
    srcDir rootProject.file('common-gameplay/src/main/java')
}

sourceSets.main.resources {
    srcDir rootProject.file('shared-resources')
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.forge_minecraft_version}-${rootProject.forge_version}"
    implementation project(':common-core')

    compileOnly "curse.maven:jei-238222:7391695"
    compileOnly "curse.maven:jade-324717:5072729"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : rootProject.forge_minecraft_version,
        minecraft_version_range: rootProject.forge_minecraft_version_range,
        forge_version          : rootProject.forge_version,
        forge_version_range    : rootProject.forge_version_range,
        mod_id                 : rootProject.mod_id,
        mod_name               : rootProject.mod_name,
        mod_license            : rootProject.mod_license,
        mod_version            : rootProject.mod_version,
        mod_authors            : rootProject.mod_authors,
        mod_description        : rootProject.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':common-core:classes'
    from(project(':common-core').sourceSets.main.output)
    archiveFileName = "velorise-emc-${rootProject.mod_version}-forge-${rootProject.forge_minecraft_version}.jar"

    manifest {
        attributes([
            'Specification-Title'      : rootProject.mod_id,
            'Specification-Vendor'     : rootProject.mod_authors,
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : rootProject.mod_version,
            'Implementation-Vendor'    : rootProject.mod_authors,
            'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
