subprojects {
    tasks.matching { it.name in ['compileJava', 'compileTestJava', 'processResources', 'processTestResources'] }.configureEach {
        dependsOn rootProject.tasks.named('cleanRetiredSources')
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Velorise EMC target.'
    dependsOn ':common-core:check', ':common-gameplay:check', ':forge-1.20.1:build', ':neoforge-1.21.1:build'
}


tasks.named('build') {
    dependsOn 'buildAll'
}

tasks.register('deleteTargetTextures', Delete) {
    group = 'build setup'
    description = 'Deletes the 7 item texture files so user can copy new ones manually.'
    delete 'shared-resources/assets/velorise_emc/textures/item/deepbound_eye.png'
    delete 'shared-resources/assets/velorise_emc/textures/item/dragonfire_scepter.png'
    delete 'shared-resources/assets/velorise_emc/textures/item/echobound_dragon_scale.png'
    delete 'shared-resources/assets/velorise_emc/textures/item/ghastfire_staff.png'
    delete 'shared-resources/assets/velorise_emc/textures/item/heart_of_the_last_echo.png'
    delete 'shared-resources/assets/velorise_emc/textures/item/void_translocator.png'
    delete 'shared-resources/assets/velorise_emc/textures/item/wither_scepter.png'
}

tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Builds all targets and copies release jars into /dist.'
    dependsOn 'buildAll'

    doFirst {
        project.delete(rootProject.fileTree('dist') {
            exclude '.gitkeep'
        })
        rootProject.file('dist').mkdirs()
    }

    from(project(':forge-1.20.1').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar', '*-dev.jar', '*-slim.jar'
    }
    from(project(':neoforge-1.21.1').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar', '*-dev.jar', '*-slim.jar'
    }
    into layout.projectDirectory.dir('dist')

    doLast {
        copy {
            from layout.projectDirectory.dir('dist')
            into rootProject.file('../mods')
        }
        File neoMods = file('C:/Users/hunga/AppData/Roaming/.minecraft/versions/Neo 1.21.1/mods')
        if (neoMods.exists()) {
            project.delete(fileTree(neoMods) { include 'velorise-emc-*.jar' })
            copy {
                from layout.projectDirectory.dir('dist')
                include '*-neoforge-1.21.1.jar'
                into neoMods
            }
        }
    }
}


tasks.register('verifyRefactorArchitecture') {
    group = 'verification'
    description = 'Runs shared-source guards and the dependency-free common-core smoke suite.'
    dependsOn ':common-gameplay:check'
    doLast {
        exec {
            workingDir rootProject.projectDir
            commandLine 'python3', 'scripts/validate_source_tree.py'
        }
        exec {
            workingDir rootProject.projectDir
            commandLine 'python3', 'scripts/audit_source_duplication.py'
        }
        exec {
            workingDir rootProject.projectDir
            commandLine 'bash', 'scripts/run_common_core_smoke.sh'
        }
    }
}
