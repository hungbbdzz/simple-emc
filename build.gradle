    description = 'Deletes retired source and resource files left behind when a release is merged over an older project tree.'

    delete fileTree('common-core/src/main/java') {
        include '**/ArcaneBookshelfProfile.java'
        include '**/ArcaneEnchantMemory.java'
        include '**/ArcaneEnchantMemoryEntry.java'
        include '**/ArcaneEnchantingProfile.java'
    }
    delete fileTree('common-core/src/test/java') {
        include '**/ArcaneBookshelfProfileTest.java'
        include '**/ArcaneEnchantMemoryTest.java'
        include '**/ArcaneEnchantingProfileTest.java'
    }
    delete fileTree('common-gameplay/src/main/java') {
        include '**/ArcaneBookshelfItem.java'
        include '**/ArcaneMemoryScreen.java'
        include '**/PouchFilter*.java'
        include '**/AutoBurnMiningPouch*.java'
        include '**/ResonantHopper*.java'
        include '**/PortableDispenserMenu.java'
        include '**/VerdantComposter*.java'
    }
    delete fileTree('forge-1.20.1/src/main/resources/data/velorise_emc/recipes') {
